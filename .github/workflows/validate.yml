name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  compile:
    name: Python and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/lsa_saf/manifest.json >/dev/null
          python -m json.tool custom_components/lsa_saf/strings.json >/dev/null
          python -m json.tool custom_components/lsa_saf/translations/en.json >/dev/null
          python -m json.tool custom_components/lsa_saf/translations/hu.json >/dev/null
          python -m json.tool hacs.json >/dev/null


  tests:
    name: Pytest + config-flow coverage
    env:
      PYTHONPATH: ${{ github.workspace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Run tests
        run: pytest --cov=custom_components.lsa_saf.config_flow --cov-report=term-missing --cov-fail-under=100

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Brand assets are intentionally deferred for the first custom-repository test.
          # Remove this ignore before submitting the repository to HACS defaults.
          ignore: brands
