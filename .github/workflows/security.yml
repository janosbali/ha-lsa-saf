name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install security scanners
        run: python -m pip install --disable-pip-version-check bandit pip-audit detect-secrets
      - name: Bandit
        run: bandit -r custom_components -ll -ii
      - name: Audit integration runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/lsa_saf/manifest.json").read_text())
          dependencies = manifest.get("requirements", [])
          Path("/tmp/lsa-saf-runtime-requirements.txt").write_text(
              "\n".join(dependencies), encoding="utf-8"
          )
          print(f"Runtime dependencies declared by the integration: {len(dependencies)}")
          PY
          if [ -s /tmp/lsa-saf-runtime-requirements.txt ]; then
            pip-audit -r /tmp/lsa-saf-runtime-requirements.txt
          else
            echo "No third-party runtime dependencies to audit"
          fi
      - name: Secret-pattern scan
        run: detect-secrets scan --baseline .secrets.baseline --all-files --exclude-files '^(\.git/|\.venv)' && git diff --exit-code -- .secrets.baseline
